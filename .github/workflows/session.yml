name: Trading session

on:
  schedule:
    # 21:37 UTC, weekdays — after the US close, after LSE has settled.
    # Off the :00/:30 mark deliberately: GitHub queues scheduled jobs best-effort,
    # and round times see the most contention, so this dodges some of that drift.
    - cron: "37 21 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch prices but don't call the model or trade"
        type: boolean
        default: false

# Needed so the job can commit the updated book back to the repo.
permissions:
  contents: write

concurrency:
  group: trading-session
  cancel-in-progress: false

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Run session
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python scripts/session.py

      - name: Commit the book
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "dealing-book"
          git config user.email "actions@github.com"
          git add docs/book.json docs/history.jsonl
          if git diff --staged --quiet; then
            echo "Nothing changed — no commit."
          else
            git commit -m "Session $(date -u +%Y-%m-%d)"
            git push
          fi
